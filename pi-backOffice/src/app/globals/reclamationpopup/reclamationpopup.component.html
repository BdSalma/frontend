<div id="popup1" class="popup">
    <div class="popup-content border rounded p-4" style="max-width: 400px">
        <span class="close" (click)="closeDialog()">&times;</span>
        <h4 class="popup-title" >Cette reclamation est {{  this.pos > this.nega && this.pos > this.neu ? "Positive" : this.neu > this.nega && this.neu > this.pos ? "Neutre" : "Negative"       }}</h4><br>
        <div class="popup-body text-center">
            <div class=" z-index-2">
                <div class="card-body d-flex flex-column align-items-center">
                  <h6 class="mb-0">
                    Statistique
                  </h6>
                  <canvas id="pie-chart" class="mt-3" ></canvas>
                </div>
              </div>
              <p>
                " {{reclamation}} "
              </p>
        </div>

    </div>
</div>
