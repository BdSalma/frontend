<body class="about-us bg-gray-200">
    <div class="container position-sticky z-index-sticky top-0">
      <div class="row">
        <div class="col-12">
          <app-navbar-index></app-navbar-index>
      </div>
  </div>
  </div>
  <header class="bg-gradient-dark">
      <div class="page-header min-vh-75" style="background-image: url('../assets/imgB/bg9.jpg');">
        
      </div>
    </header>
    <div class="card card-body shadow-xl mx-3 mx-md-4 mt-n6">
      <section class="py-7">
        <div class="container">
          <div class="row justify-content-center">
            <h2>Liste des packs Disponibles</h2>
            <br>
            <br>
            <div class="col-lg-6">
              
              <div class="row justify-content-center"><!-- Adjusted here -->
                <div *ngFor=" let pack of packs" class="col-md-6">
                  <div class="shadow p-3 mb-5 bg-white rounded" >
                    <div *ngIf="pack.typePack === 'Gold'" class="author" style="display: flex; align-items: center; justify-content: center;">
                      <img style="width: 25px; height: 25px;" src="../../../assets/img/icons/lingot-dor.png" alt="Diamond Logo">
                      <h3 class="mb-0 font-weight-bolder">Gold</h3>
                    </div>
                    <div *ngIf="pack.typePack === 'Silver'" class="author" style="display: flex; align-items: center; justify-content: center;">
                      <img style="width: 25px; height: 25px;" src="../../../assets/img/icons/silver.png" alt="Diamond Logo">
                      <h3 class="mb-0 font-weight-bolder">Silver</h3>
                    </div>
                    <div *ngIf="pack.typePack === 'Diamond'" class="author" style="display: flex; align-items: center; justify-content: center;">
                      <img style="width: 25px; height: 25px;" src="../../../assets/img/icons/diamant.png" alt="Diamond Logo">
                      <h3 class="mb-0 font-weight-bolder">Diamond</h3>
                    </div>
                    <div *ngIf="pack.typePack === 'Platinum'" class="author" style="display: flex; align-items: center; justify-content: center;">
                      <img style="width: 25px; height: 25px;margin-right: 5%;" src="../../../assets/img/icons/platinum.png" alt="Diamond Logo">
                      <h3 class="mb-0 font-weight-bolder">Platinum</h3>
                    </div>
    
                    <div class="card-body">
                   
                      <ul class="list-unstyled">
                        <li><strong>Prix :</strong> {{ pack.prix }}</li>
                        <li><strong>Numéro du stand :</strong> {{ pack.stand.number }}</li>
                        <li><strong>Zone du Stand :</strong> {{ pack.stand.zone }}</li>
                      </ul>
                    </div>
                    <button tyle="float: left;" class="btn btn-info btn-sm" (click)="bookPack(pack.id)">Réserver</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </div>
    <div id="carouselExampleSlidesOnly" class="carousel slide" data-ride="carousel">
      <div class="carousel-inner">
        <div class="carousel-item active">
          <img style="width: 25px; height: 25px;margin-right: 5%;" src="../../../assets/img/icons/platinum.png" alt="Diamond Logo">
                      <h3 class="mb-0 font-weight-bolder">Platinum</h3>
        </div>
        <div class="carousel-item">
          <img style="width: 25px; height: 25px;margin-right: 5%;" src="../../../assets/img/icons/platinum.png" alt="Diamond Logo">
          <h3 class="mb-0 font-weight-bolder">Platinum</h3>
        </div>
        <div class="carousel-item">
          <img style="width: 25px; height: 25px;margin-right: 5%;" src="../../../assets/img/icons/platinum.png" alt="Diamond Logo">
          <h3 class="mb-0 font-weight-bolder">Platinum</h3>
        </div>
      </div>
    </div>
  <app-footer-index></app-footer-index>
  </body>
